# Redis configuration for AI-MOS development

# Persistence
save 900 1
save 300 10
save 60 10000

# Memory policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Bind to all interfaces in container
bind 0.0.0.0

# Disable protected mode for development container
protected-mode no
