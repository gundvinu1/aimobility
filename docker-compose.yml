version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-mos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aimosuser
      POSTGRES_PASSWORD: aimospassword
      POSTGRES_DB: aimosdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aimosuser -d aimosdb']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-mos-network

  redis:
    image: redis:7-alpine
    container_name: ai-mos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-mos-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-mos-network:
    driver: bridge
